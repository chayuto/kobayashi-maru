<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kobayashi Maru - Page Not Found</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0a0e1a;
        color: #c8d6e5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
      }
      .container {
        max-width: 480px;
        padding: 2rem;
      }
      h1 {
        font-size: 4rem;
        color: #4af;
        margin-bottom: 0.5rem;
      }
      h2 {
        font-size: 1.5rem;
        color: #8899aa;
        margin-bottom: 1.5rem;
        font-weight: 400;
      }
      p {
        font-size: 1.1rem;
        line-height: 1.6;
        margin-bottom: 2rem;
      }
      a {
        display: inline-block;
        padding: 0.75rem 2rem;
        background: #4af;
        color: #0a0e1a;
        text-decoration: none;
        border-radius: 4px;
        font-weight: 600;
        font-size: 1rem;
        transition: background 0.2s;
      }
      a:hover {
        background: #6cf;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>404</h1>
      <h2>Sector Not Found</h2>
      <p>The coordinates you entered don't match any known sector. The Kobayashi Maru awaits your defense on the main bridge.</p>
      <a href="./">Return to Bridge</a>
    </div>
  </body>
</html>

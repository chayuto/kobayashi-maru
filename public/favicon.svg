<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="g" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4af"/>
      <stop offset="100%" stop-color="#0a2a5a"/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0a0e1a" stroke="#4af" stroke-width="2"/>
  <!-- Starship silhouette (saucer + hull) -->
  <ellipse cx="32" cy="26" rx="16" ry="6" fill="url(#g)" opacity="0.9"/>
  <rect x="29" y="30" width="6" height="14" rx="2" fill="#3388cc" opacity="0.8"/>
  <!-- Nacelle struts -->
  <line x1="22" y1="38" x2="14" y2="46" stroke="#4af" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="38" x2="50" y2="46" stroke="#4af" stroke-width="2" stroke-linecap="round"/>
  <!-- Nacelles -->
  <rect x="9" y="44" width="12" height="4" rx="2" fill="#4af" opacity="0.9"/>
  <rect x="43" y="44" width="12" height="4" rx="2" fill="#4af" opacity="0.9"/>
  <!-- Engine glow -->
  <circle cx="15" cy="46" r="3" fill="#6cf" opacity="0.5"/>
  <circle cx="49" cy="46" r="3" fill="#6cf" opacity="0.5"/>
</svg>
